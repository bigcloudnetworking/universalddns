[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universalddns"
version = "0.1.0"
authors = [
  { name = "Brett Hoshaw", email = "admin@bigcloudnetworking.com" },
]
description = "A universal dynamic DNS client package"
readme = "README.md"
requires-python = ">=3.7"
license-files = ["LICENSE"]
  keywords = ["ddns", "dynamic", "dns", "cloudflare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Homelab",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx",
]

[project.urls]
"Homepage" = "https://github.com/bigcloudnetworking/universalddns"
"Bug Tracker" = "https://github.com/bigcloudnetworking/universalddns/issues"

[project.scripts]
universalddns = "universalddns.ddns_updater:main"

[tool.setuptools.packages.find]
where = ["."]
